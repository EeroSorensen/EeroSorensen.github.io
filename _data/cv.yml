          - "PivotChart linked dynamically to PivotTable"
          - "Conditional formatting rule applied to raw dataset"
        start_date: 2026-02
        
      - name: "Problem and Solution Presentation"
        summary: "This presentation addresses the critical health issue of Reduced Aerobic Capacity (RAC), specifically focusing on the population of individuals with Down Syndrome (DS). The authors emphasize that people with DS often face significant physiological barriers, such as muscle hypotonia (low muscle tone), joint laxity, and congenital heart disease, which contribute to high obesity rates and low fitness levels"
        highlights:
          - "Conceptually designed a gamified physical activity application specifically for children and adolescents with Down Syndrome to address sedentary lifestyles"
          - "Researched and applied methods to enhance autonomy in adolescents with disabilities, allowing for self-monitoring of health goals."
        start_date: 2026-03

      - name: "Data Driven Advancements in Major League Baseball: The Rise of Torpedo Bats"
        summary: "This research paper explores the "Torpedo bat craze" in Major League Baseball (MLB) as a case study for how data-driven optimization is redefining professional sports. It highlights the limitations of traditional, "one size fits all" wooden bats, which have remained largely unchanged for over a century despite the immense difficulty of hitting a 90-mph fastball."
        highlights:
          - "Utilized complex datasets and statistical modeling (including tree-based learning and boosted forests) to evaluate how non-linear design variables influence athletic performance."
          - "Examined the interaction between human reaction time ($250\text{ms}$) and pitch velocity to identify critical performance windows in high-pressure sporting environments"
        start_date: 2026-03


      

